# ============================================================
# cosme 運用設定
# コードを触らずにここだけで運用方針を変更できるようにしている。
# ============================================================

[account]
# 表示名はプロフィールに合わせて本人が変える（ここはプロフィールを変えない）
display_name = "コスメ買い物メモ｜コスパ美容"
# 2026-09-14 に発信ジャンルを「コスメ・美容」→「転職・年収・キャリア」へ変更
concept = "転職経験のある会社員が、転職・年収・キャリアの知っておくと得する話をする"

# ------------------------------------------------------------
# 楽天API
# ------------------------------------------------------------
[rakuten]
# 2026年のインフラ刷新後のドメイン。旧 app.rakuten.co.jp は 2026-05-13 に停止済み。
endpoint = "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701"
# 上のバージョンが弾かれた場合に順に試す候補（クライアントが自動フォールバックする）
fallback_endpoints = [
    "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20220601",
    "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20170706",
]
# 新APIは Origin/Referer が無いと 403 を返す。
# 楽天デベロッパーコンソールの「許可Webサイト」に登録したURLと一致させること。
# 環境変数 RAKUTEN_ORIGIN があればそちらが優先される。
origin = "https://ryota-sotoguchi.github.io"
user_agent = "cosme-bot/1.0 (+https://github.com/Ryota-Sotoguchi/cosme)"

# 1 applicationId につき 1秒1リクエスト以下。安全側に倒して 1.2 秒あける。
min_interval_seconds = 1.2
hits_per_page = 30
max_pages = 8
connect_timeout = 10.0
read_timeout = 20.0
max_retries = 4
backoff_base_seconds = 1.5
backoff_max_seconds = 30.0

# ------------------------------------------------------------
# Threads API
# ------------------------------------------------------------
[threads]
api_base = "https://graph.threads.net/v1.0"
oauth_base = "https://graph.threads.net"
max_text_length = 500
# コンテナ作成から公開までの待機秒数（公式推奨は平均30秒）
publish_wait_seconds = 30
connect_timeout = 10.0
read_timeout = 30.0
max_retries = 3
# トークン残日数がこれを下回ったら警告を出す
token_warn_days = 14

# ------------------------------------------------------------
# 商品選定
# ------------------------------------------------------------
[selection]
# 2026-08-21: 料率が全商品一律4.0%と判明したため、報酬額は価格でしか
# 動かない。コンセプト（コスパ美容）を維持しつつ、単価の高い専門コスメも
# 少し候補に入るよう上限だけ広げた（5,000円 → 8,000円）。
#
# 2026-09-03: 15日間の実績で1成約48円（価格1,200円 × 4.0%）だった。
# 紹介した23商品の価格中央値は1,700円で、1成約あたり68円。
# 楽天の報酬上限は1商品1個につき1,000円なので、上限の1/15しか使えていない。
# 上限を20,000円まで広げ、スコアリング側の「安いほど高得点」も弱める
# （[scoring.weights] price_affordability を 2.0 → 1.0）。
#
# コンセプトは「安いものを出すこと」ではなく「数字で比べて損しない選び方」
# なので、1万円の道具を単価計算で正当化する投稿はコンセプトから外れない。
# 2026-09-28: 本に合わせた。実測の価格中央値は1,430〜1,980円で、
# 料率3%なので1,000円未満の本は報酬が20円台になる。上限は問題集のセットまで。
min_price = 1000
max_price = 6000
# レビューが少なすぎる商品は客観情報として弱いので除外
# 2026-09-28: 5 → 3。本のレビューは化粧品よりずっと少ない
# （208962 と 208679 は中央値4件）。5のままだと候補が半分以下に落ちる。
min_review_count = 3
min_review_average = 3.5
require_image = true
require_available = true
# 1回の投稿で検討する候補数の上限
candidate_pool = 300
# 除外・クールダウンを通過した候補がこれを下回ったら、
# 別ページを追加取得して自動で積み増す（商品が枯れるのを防ぐ）
min_usable_candidates = 20
pool_refill_attempts = 3

# 対象ジャンル
# **推測でIDを書かない。** 実APIで引いて、返る商品名を目視してから採用する。
#
# 2026-09-28 に本（転職・資格）へ差し替えた。キーワード検索（転職／職務経歴書／
# 簿記／ITパスポート等）で返る genreId を集計し、各IDを開いて中身を確認した実測値:
#
#   208962  就職・転職の本   楽天ブックス100%  レビュー中央値 4件   価格中央値 1,650円
#   208967  ビジネス実用書   楽天ブックス 95%  レビュー中央値13.5件  価格中央値 1,540円
#           （「伝え方が9割」「人間関係」等。転職そのものではないので label は «働き方の本»）
#   101937  PC・IT資格      楽天ブックス 98%  レビュー中央値15件   価格中央値 1,980円
#   208679  簿記            楽天ブックス 83%  レビュー中央値 4件   価格中央値 1,430円
#
# **料率は本だと一律3.0%**（化粧品は4.0%だった）。1冊売れて40〜60円。
#
# 採らなかったもの:
#   200518  お金・投資の本。「お金は銀行に預けるな」等で発信ジャンルからずれる
#   208683  宅建。レビュー5件以上が60件中11件しかなく、候補が薄い
#   208725  検定テキスト。アロマ・神社・手話が中心でキャリアと関係が薄い
#   209087  楽天Koboの電子書籍が9割。紙の本として紹介する形に合わない
#
# 休止中の化粧品のジャンル（2026-08-20 実測）。楽天のコスメ投稿を戻すときはここから:
#   216307  スキンケア
#   216348  スキンケア
#   216387  スキンケア
#   216539  メイク
#   216579  メイク
#   216600  メイク
#   210695  ヘアケア
#   210677  ヘアケア
#   507825  ヘアケア
#   216670  ボディケア
#   216671  ボディケア
#   507866  美容小物
#   111791  美容小物

[[selection.genres]]
id = 208962
label = "転職本"

[[selection.genres]]
id = 208967
label = "働き方の本"

[[selection.genres]]
id = 101937
label = "資格本"

[[selection.genres]]
id = 208679
label = "資格本"

