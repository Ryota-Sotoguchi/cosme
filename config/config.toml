# 書名にこれらのうち1つも含まれなければ除外する（商品名だけを見る）。
#
# 本のジャンルは広く、除外語を足すだけでは追いつかなかった。
# 「転職・年収・キャリア」から外れた本が、禁止語に当たらないまま
# スコア1位に来る（2026-10-13 の実測で14本中6本）。**逆向きに、
# 書名がジャンルを名乗っていない本を落とす。**
#
# キャッチコピーは見ない。店が自由に書くので «その本が何の本か» の
# 根拠にならない。書名で分かる本だけを扱えば、
# 「書名から種類が分からない本に別の種類の話を付ける」失敗も起きない。
#
# **掛かるのは下の require_any_keywords_labels に挙げたジャンルだけ。**
# 休止中の化粧品の経路には掛からないので、再開するときにここを触る必要はない。
