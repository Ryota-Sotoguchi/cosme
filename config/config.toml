# ------------------------------------------------------------
# 除外（広告表現リスクの高いカテゴリーを機械的に落とす）
# ------------------------------------------------------------
[exclusion]
# 商品名・キャッチコピーにこれらが含まれたら無条件で除外
keywords = [
    "医薬品", "第1類", "第一類", "第2類", "第二類", "第3類", "第三類",
    "指定第2類", "指定第二類",
    "医薬部外品", "薬用", "薬用化粧品",
    "サプリ", "サプリメント", "栄養補助", "健康食品", "機能性表示食品", "特定保健用食品", "トクホ",
    "ダイエット", "痩身", "脂肪燃焼", "カロリーカット",
    "育毛", "発毛", "養毛", "発毛促進", "薄毛", "AGA", "ミノキシジル",
    "美容医療", "美容外科", "クリニック", "施術", "注入", "注射",
    "治療", "治療薬", "処方", "処方箋", "medical",
    "ピアッサー", "コンタクト", "カラコン", "度あり", "度なし",
    "妊娠", "避妊", "生理用品",
    "白髪染め",
    "まつげ美容液", "まつ毛美容液",
    "デリケートゾーン", "VIO", "黒ずみ",
    "CBD", "エステサロン", "サロン専売",
    "訳あり", "アウトレット", "福袋", "詰め合わせ", "セット売り",
    # 空容器・詰め替え用の入れ物。化粧品ではないのに美容ジャンルに入っている
    "遮光瓶", "茶ボトル", "スプレーボトル", "空容器", "詰め替え容器",
    "アトマイザー", "小分けボトル", "クリーム容器", "ポンプボトル",
    "業務用", "サンプル", "お試しサンプル", "非売品",
]
# これらのジャンルIDおよびその配下は除外
genre_ids = [
    551167,   # 医薬品・コンタクト・介護
    100938,   # ダイエット・健康
    100227,   # 食品
    551169,   # スイーツ・お菓子
]
# ショップ名にこれらが含まれる場合は除外
shop_keywords = ["薬局", "薬店", "ドラッグ", "調剤"]

# ------------------------------------------------------------
# スコアリング重み（合計で正規化されるので相対値でよい）
# ------------------------------------------------------------
[scoring.weights]
review_count = 3.0        # レビュー件数（対数正規化）: 客観性が最も高いので最重視
review_average = 2.5      # レビュー平均
price_affordability = 2.0 # 価格の手頃さ（コスパ重視コンセプト）
postage_free = 1.5        # 送料無料
point_rate = 0.8          # ポイント倍率
affiliate_rate = 0.4      # アフィリエイト料率: 意図的に低く抑える
has_image = 0.5           # 商品画像あり

[scoring]
# アフィリエイト料率が総合スコアに占める寄与率の上限。
# 「料率が高いだけの商品」が選ばれ続けるのを構造的に防ぐ。
affiliate_rate_contribution_cap = 0.10
# 偏り抑制（直近履歴に同じ属性が出ているほど減点）
shop_penalty = 0.35
brand_penalty = 0.30
genre_penalty = 0.20
# 偏り判定に使う直近投稿件数
recency_window = 20

# ------------------------------------------------------------
# 重複防止
# ------------------------------------------------------------
[dedup]
# 同一商品の再投稿を禁止する日数
item_cooldown_days = 30
# 同一ショップの再登場を避ける日数
shop_cooldown_days = 3
# 直近何件の本文と類似度比較するか
#
# 「件数」なので、1日の投稿数を増やすと射程の日数が縮む。
# 60件は1日5本の頃は12日ぶんだったが、10本にした時点で6日ぶんになり、
# 実際に7日あけて同じつぶやきが再登場した（14日通しで9件）。
# 10本/日 × 14日 = 140。2週間は同じ文を出さない。
# test_similarity_window_covers_two_weeks が枠数との対応を見張る。
similarity_window = 140
# 類似度がこれを超えたら不合格（0.0-1.0）
max_similarity = 0.72
# 同一テンプレートの連続使用禁止回数
template_cooldown = 4

# ------------------------------------------------------------
# 投稿スケジュール（JST）
# GitHub Actions 側の cron と一致させること
# ------------------------------------------------------------
[[schedule]]
slot = "morning"
time_jst = "07:30"
cron_utc = "30 22 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "midmorning"
time_jst = "09:30"
cron_utc = "30 0 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "latemorning"
time_jst = "11:00"
cron_utc = "0 2 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "noon"
time_jst = "12:15"
cron_utc = "15 3 * * *"
post_type = "product"
allow_affiliate = true

# 12:15 から 18:00 まで5時間45分空いていたので、その間を埋める。
# どちらもリンクなし。露出を増やすのが目的で、広告を増やすのが目的ではない。
[[schedule]]
slot = "afternoon"
time_jst = "14:30"
cron_utc = "30 5 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "predinner"
time_jst = "16:30"
cron_utc = "30 7 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "evening"
time_jst = "18:00"
cron_utc = "0 9 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "earlynight"
time_jst = "19:00"
cron_utc = "0 10 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "night"
time_jst = "20:30"
cron_utc = "30 11 * * *"
post_type = "product"
allow_affiliate = true

[[schedule]]
slot = "late"
time_jst = "22:30"
cron_utc = "30 13 * * *"
post_type = "rotation"
allow_affiliate = true

# ローテーション順（state.json でカーソルを保持）
#
# casual       … ただのつぶやき。結論も落ちもない一行
# question     … 短い問いかけ。返信はいちばん強い反応シグナルなので専用枠にした
# no_link      … 買い物・選び方の話（2段落の助言型）
# thread_topic … 言い切り → 理由の連投
# howto        … 箇条書きのチェックリスト
#
# もとは howto / thread_topic / no_link が枠の大半を占めていて、
# 「役に立つことを整った形で言う」投稿しか出ていなかった。
# 人がふだんThreadsに書くのは結論のない一行や答えのない疑問なので、
# casual と question を主役にして、整った型は少数派にする。
[rotation]
# 2026-08-31: 実績で組み替えた。
#
#   型            件数  表示中央値  反応率
#   casual          6      320     0.23%   ← 表示がいちばん伸びる
#   thread_topic    3      190     0.93%   ← 反応率がいちばん高い
#   question        6      114     0.81%
#   no_link        22      132     0.19%   ← いちばん多く出していたのに割に合わない
#   howto           4       62     0.00%   ← 表示も反応も最下位
#
# no_link と howto を削って、casual / thread_topic / question に寄せた。
# howto は完全には消さない（箇条書きが効く商品もあるので、朝に1枠だけ残す）。
morning = [
    "casual",
    "thread_topic",
    "question",
    "casual",
    "thread_topic",
    "howto",
    "question",
    "casual",
]
midmorning = [
    "casual",
    "question",
    "casual",
    "thread_topic",
    "casual",
    "question",
    "casual",
]
latemorning = [
    "casual",
    "thread_topic",
    "question",
    "casual",
    "casual",
    "question",
    "thread_topic",
]
afternoon = [
    "question",
    "casual",
    "casual",
    "thread_topic",
    "question",
    "casual",
    "no_link",
]
predinner = [
    "casual",
    "casual",
    "question",
    "thread_topic",
    "casual",
    "question",
    "casual",
]
evening = [
    "thread_topic",
    "casual",
    "question",
    "casual",
    "thread_topic",
    "casual",
    "no_link",
]
earlynight = [
    "casual",
    "question",
    "thread_topic",
    "casual",
    "casual",
    "thread_topic",
    "question",
]
late = [
    "product",        # 商品紹介
    "price_band",     # 価格帯別候補
    "no_link",        # リンクなし
    "review_heavy",   # レビュー件数が多い商品の整理
    "postage_free",   # 送料無料の商品
    "no_link",        # リンクなし
    "comparison",     # 比較
]

# ------------------------------------------------------------
# ランプアップ（新規アカウントの初期はリンク投稿を抑える）
# ------------------------------------------------------------
[ramp_up]
enabled = true
# 1日の総投稿数の上限。スケジュールは8本なので、少しだけ余裕を持たせる。
#
# ランプアップはリンク投稿の本数しか見ていなかったため、動作確認の手動実行が
# 積み上がって1日18件投稿し、MetaにAPIアクセスをブロックされた。
# 種別も実行トリガーも問わず、ここで頭打ちにする。
#
# 通常投稿の枠を増やしたので 7 → 10 → 12 に上げた。**上限自体は外さない。**
# ここが無いと、手動実行が積み上がったときに同じ事故が起きる。
max_posts_per_day = 12
# 運用開始からの日数 -> その日に許可するアフィリエイトリンク投稿の最大本数
# キーは「この日数まで」
stages = [
    { until_day = 7, max_link_posts = 1 },
    { until_day = 14, max_link_posts = 2 },
]
# 上記を過ぎた後の通常運転
default_max_link_posts = 3

# ------------------------------------------------------------
# コンプライアンス
# ------------------------------------------------------------
[compliance]
pr_marker = "#PR"
# PR表記はこの文字数以内（冒頭付近）に無ければ不合格
pr_marker_max_offset = 20
allowed_url_hosts = ["hb.afl.rakuten.co.jp", "a.r10.to", "affiliate.rakuten.co.jp"]
# 1投稿あたりのURL上限
max_urls = 1
# 生成をやり直す最大回数
max_regenerations = 4
# 候補商品をスキップして次を試す最大回数
max_item_skips = 12

# ------------------------------------------------------------
# 他人の投稿への返信
#
# 露出を増やす手段。ただし **自動では投稿しない**。
# スクレイプで取れる短縮ID（DTVoI4xlSTZ）は、APIが reply_to_id に
# 要求する数値ID（17908396266285102）とは別のID空間なので、
# そもそもAPIから返信できない。パーマリンクを開いて人が返す。
# ------------------------------------------------------------
[engagement]
# 1日の返信数の上限。Metaのスパム規定は「非常に高い頻度」を見るので、
# 数を追わない。返す価値のある投稿だけに返す。
max_per_day = 3
# 同じ相手に張り付かない
same_account_cooldown_days = 7
# 候補のうち美容・コスメが占める割合。
# 軸は崩さず、外の話題も入れて露出先を狭めすぎない。
beauty_ratio = 0.8
# 1回の収集で出す候補の数
candidate_limit = 12
