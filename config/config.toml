# ============================================================
# cosme 運用設定
# コードを触らずにここだけで運用方針を変更できるようにしている。
# ============================================================

[account]
display_name = "コスメ買い物メモ｜コスパ美容"
concept = "楽天の公開情報ベースでコスパ美容を整理する買い物メモ"

# ------------------------------------------------------------
# 楽天API
# ------------------------------------------------------------
[rakuten]
# 2026年のインフラ刷新後のドメイン。旧 app.rakuten.co.jp は 2026-05-13 に停止済み。
endpoint = "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701"
# 上のバージョンが弾かれた場合に順に試す候補（クライアントが自動フォールバックする）
fallback_endpoints = [
    "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20220601",
    "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20170706",
]
# 新APIは Origin/Referer が無いと 403 を返す。
# 楽天デベロッパーコンソールの「許可Webサイト」に登録したURLと一致させること。
# 環境変数 RAKUTEN_ORIGIN があればそちらが優先される。
origin = "https://ryota-sotoguchi.github.io"
user_agent = "cosme-bot/1.0 (+https://github.com/Ryota-Sotoguchi/cosme)"

# 1 applicationId につき 1秒1リクエスト以下。安全側に倒して 1.2 秒あける。
min_interval_seconds = 1.2
hits_per_page = 30
max_pages = 3
connect_timeout = 10.0
read_timeout = 20.0
max_retries = 4
backoff_base_seconds = 1.5
backoff_max_seconds = 30.0

# ------------------------------------------------------------
# Threads API
# ------------------------------------------------------------
[threads]
api_base = "https://graph.threads.net/v1.0"
oauth_base = "https://graph.threads.net"
max_text_length = 500
# コンテナ作成から公開までの待機秒数（公式推奨は平均30秒）
publish_wait_seconds = 30
connect_timeout = 10.0
read_timeout = 30.0
max_retries = 3
# トークン残日数がこれを下回ったら警告を出す
token_warn_days = 14

# ------------------------------------------------------------
# 商品選定
# ------------------------------------------------------------
[selection]
min_price = 500
max_price = 5000
# レビューが少なすぎる商品は客観情報として弱いので除外
min_review_count = 5
min_review_average = 3.5
require_image = true
require_available = true
# 1回の投稿で検討する候補数の上限
candidate_pool = 90

# 対象ジャンル
# 2026-08-20 に実APIで検証済み。キーワード検索で返る genreId を集計し、
# 各IDから実際に取得できる商品名を目視確認して採用した。
# ※推測でIDを書かないこと。以前 216131 を「スキンケア」としていたが、
#   実際にはネックレス等が返っていた。
