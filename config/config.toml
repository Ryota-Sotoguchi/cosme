    # 転職・採用・キャリア
    "転職", "就職", "再就職", "求人", "面接", "履歴書", "職務経歴書",
    "自己PR", "自己分析", "キャリア", "年収", "給料", "給与", "賞与",
    "昇進", "昇給", "人事", "採用", "評価制度", "退職", "辞める", "辞め方",
    "独立", "フリーランス", "副業禁止", "エージェント",
    # 働き方・仕事の進め方
    "働き方", "仕事術", "社会人", "ビジネスマナー", "職場", "会社員",
    "上司", "部下", "残業", "定年", "組織", "リモートワーク", "在宅勤務",
    "段取り", "時間術", "手帳", "ノート術", "思考法", "問題解決",
    "ロジカル", "文章術", "資料作成",
    # 伝え方・人間関係（ビジネス実用の意図したところ）
    "コミュニケーション", "伝え方", "話し方", "聞き方", "会話", "雑談", "交渉",
    "人間関係", "気くばり", "付き合い方",
    "リーダー", "マネジメント", "マネジャー", "管理職",
    "会議", "プレゼン", "スライド", "敬語", "アサーション", "コーチング",
    "メモの技術", "図解", "タスク管理", "生産性",
    # 資格・学習（特定の試験名で絞る。"試験" や "合格" だけでは
    # 無線・施工の問題集まで通ってしまう）
    "簿記", "日商", "会計", "経理", "財務", "税務",
    "FP", "ファイナンシャル", "宅建", "社労士", "社会保険労務士",
    "行政書士", "中小企業診断士", "税理士", "公認会計士", "秘書検定",
    "衛生管理者", "キャリアコンサルタント",
    "ITパスポート", "基本情報", "応用情報", "情報処理", "情報セキュリティ",
    "MOS", "Excel", "Access", "VBA", "関数",
    "TOEIC", "英会話", "ビジネス英語",
    "資格", "検定", "勉強法", "独学", "リスキリング", "学び直し",
]
# 2026-10-16 に外した語と、その理由（実際に通ってしまった本）。**戻すなら同じ形で確かめる。**
#   "Word"         → 「WordPress 入門教室」。MOS の Word 本は "MOS" で通る
#   "PowerPoint"   → 「動くPowerPoint素材集1000」。素材集は読む本ではない
#   "Python"       → 「ゼロから作るDeep Learning」
#   "プログラミング" → 「スクラッチプログラミング事例大全集」
#   "SQL" "データ分析" → 同じ理由（IT の技術書は発信ジャンルの外）
#   "チーム"        → 「不格好経営 チームDeNAの挑戦」。経営者の回想録
#   "問題解決"      → 「考える人のメモの技術…万能の問題解決術」は "メモの技術" で通る
#   "心理学"        → 「社会心理学キーワード」「ポテンシャル社会心理学」。大学のテキストが通る。
#                     職場の人間関係の本は "人間関係" や "伝え方" で通るので要らない
# 上の要求を掛けるジャンル（[[selection.genres]] の label と一致させる）。
# **空にすると全商品に掛かる。** 化粧品を再開するときは、
# ここに「スキンケア」などを足さないこと（化粧品は剤形語の仕組みで見る）。
require_any_keywords_labels = ["転職本", "資格本", "働き方の本"]
# これらのジャンルIDおよびその配下は除外
genre_ids = [
    551167,   # 医薬品・コンタクト・介護
    100938,   # ダイエット・健康
    100227,   # 食品
    551169,   # スイーツ・お菓子
]
# ショップ名にこれらが含まれる場合は除外
#
# 2026-09-28: 本の中古・電子書籍の店を足した。
#   中古は在庫が1点物で、紹介した翌日には無いことがある
#   楽天Koboは電子書籍。「一冊決めて使い切る」という薦め方と形が合わない
shop_keywords = [
    "薬局", "薬店", "ドラッグ", "調剤",
    "ブックオフ", "ネットオフ", "VALUE BOOKS", "もったいない本舗", "ブックサプライ",
    "Kobo", "トップカルチャー", "お取り寄せ本舗",
]

# ------------------------------------------------------------
# スコアリング重み（合計で正規化されるので相対値でよい）
# ------------------------------------------------------------
[scoring.weights]
review_count = 3.0        # レビュー件数（対数正規化）: 客観性が最も高いので最重視
review_average = 2.5      # レビュー平均
# 価格の手頃さ。2.0 だと安い商品ばかりが上位に来て、1成約68円から動かない。
# 下げすぎるとコンセプトが崩れるので半分にとどめる（2026-09-03）。
price_affordability = 1.0
postage_free = 1.5        # 送料無料
point_rate = 0.8          # ポイント倍率
affiliate_rate = 0.4      # アフィリエイト料率: 意図的に低く抑える
has_image = 0.5           # 商品画像あり

[scoring]
# アフィリエイト料率が総合スコアに占める寄与率の上限。
# 「料率が高いだけの商品」が選ばれ続けるのを構造的に防ぐ。
affiliate_rate_contribution_cap = 0.10
# 偏り抑制（直近履歴に同じ属性が出ているほど減点）
shop_penalty = 0.35
brand_penalty = 0.30
genre_penalty = 0.20
# 偏り判定に使う直近投稿件数
recency_window = 20

# ------------------------------------------------------------
# 重複防止
# ------------------------------------------------------------
[dedup]
# 同一商品の再投稿を禁止する日数
item_cooldown_days = 30
# 同一ショップの再登場を避ける日数
shop_cooldown_days = 3
# 直近何件の本文と類似度比較するか
#
# 「件数」なので、1日の投稿数を増やすと射程の日数が縮む。
# 60件は1日5本の頃は12日ぶんだったが、10本にした時点で6日ぶんになり、
# 実際に7日あけて同じつぶやきが再登場した（14日通しで9件）。
# 10本/日 × 14日 = 140。2週間は同じ文を出さない。
# test_similarity_window_covers_two_weeks が枠数との対応を見張る。
similarity_window = 140
# 類似度がこれを超えたら不合格（0.0-1.0）
max_similarity = 0.72
# 同一テンプレートの連続使用禁止回数
template_cooldown = 4

# ------------------------------------------------------------
# 投稿スケジュール（JST）
# GitHub Actions 側の cron と一致させること
# ------------------------------------------------------------
[schedule_settings]
# 定期実行が設定時刻からこの分数を超えてずれていたら、その枠は見送る。
#
# GitHub Actions の定期実行は混雑時に大きく遅れる。実測（8/20〜9/3）では
# 72件すべてが設定時刻とずれ、8/27以降は4〜11時間半の遅延が続いた。
# 朝の投稿が12:28に、夜の投稿が翌06:30に出て、そのとき表示回数1の投稿が
# 3本出ている。深夜に「朝の支度」の話をするくらいなら、出さないほうがいい。
#
# 0 にすると無効（従来どおり、どれだけ遅れても投稿する）。
# 手動実行には掛からない。
#
# 2026-09-07: 90分 → 360分。90分では**全投稿がスキップされる**。
# 実測（9/5〜9/7）のずれは中央値232分・最小99分で、90分以内に出た投稿は
# 30本中0本だった。このまま入れていたらアカウントが止まっていた。
#
# 時間帯の食い違い（朝の話が夕方に出る）は、スキップではなく
# **実際の時刻から言い回しを選ぶ**ことで直した（parts.time_band_at）。
# ここに残すのは「半日ずれたら捨てる」という最後の歯止めだけ。
# 8月末に実際にあった11時間半の遅延はこれで止まる。
#
# 2026-10-13: 360分 → 480分。**遅れが去年より100分伸びた。**
# 10/1以降の実測（n=126）はこうなっていて、360分では半分が捨てられていた。
#
#   | 上限 | 捨てられる率 |
#   |---|---|
#   | 360分 | 51.6%（実際に1日10本が3〜5本になっていた） |
#   | 450分 |  7.1% |
#   | 480分 |  6.3% |
#   | 600分 |  0.0% |
#
# 600 まで上げれば1本も捨てないが、いちばん遅い late（16:00 発火）が
# 深夜2時に落ちる余地が残る。480 なら最悪でも 00:00 着地で止まる。
# **捨てる率をゼロにするより、深夜に出さない方を採った。**
max_drift_minutes = 480

[[schedule]]
slot = "morning"
# 実際に出るのは 09:00 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "05:30"
cron_utc = "30 20 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "midmorning"
# 実際に出るのは 10:00 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "06:30"
cron_utc = "30 21 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "latemorning"
# 実際に出るのは 11:10 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "08:00"
cron_utc = "0 23 * * *"
post_type = "rotation"
allow_affiliate = false

# もとは1日で唯一のリンク枠（楽天・コスメ）。表示中央値がいちばん高い時間帯（実測282）。
# 2026-09-14 から休止中で、中身はリンクなしの型（下の allow_affiliate を参照）。
[[schedule]]
slot = "noon"
# 実際に出るのは 15:20 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "09:30"
cron_utc = "30 0 * * *"
post_type = "rotation"
# 2026-09-14 に楽天（コスメ）のリンク投稿を止め、2026-09-28 に本（転職・資格）で再開し、
# **2026-10-16 に止めた。** 止めた理由は実測:
#
#   * 楽天アフィリエイトの管理画面（90日）で **クリック1・成果報酬 ¥0**
#   * 投稿から7日以上たったものを揃えて比べると、
#     リンクあり **15表示** / #PRの無い投稿 **113表示**
#   * 本の料率は3.0%で1冊40〜60円。15表示では成約はまず出ない
#
# **収益の経路は自サイト（年収相場チェッカー）に寄せた。**
# サイトには A8 の転職エージェント広告（UZUZ・doda）が載っていて、
# 1件あたりの単価が本とは桁違い。導線は投稿型 `site_link`（下の [rotation]）。
#
# **本の仕組みは消していない。** ジャンル・除外語・books.py・テストはそのまま残して
# あるので、戻すのは `allow_affiliate = true` と rotation を直すだけ。
allow_affiliate = false

# 12:15 から 18:00 まで5時間45分空いていたので、その間を埋める。
# どちらもリンクなし。露出を増やすのが目的で、広告を増やすのが目的ではない。
[[schedule]]
slot = "afternoon"
# 実際に出るのは 17:15 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "11:00"
cron_utc = "0 2 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "predinner"
# 実際に出るのは 18:50 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "12:00"
cron_utc = "0 3 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "evening"
# 実際に出るのは 19:50 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "13:00"
cron_utc = "0 4 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "earlynight"
# 実際に出るのは 21:00 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "14:00"
cron_utc = "0 5 * * *"
post_type = "rotation"
allow_affiliate = false

# 2026-09-03: リンク投稿を1日1本（noon）に絞った。
#
# 楽天アフィリエイトのレポートは **日次のクリック数しか出せず**、
# 投稿単位に割り当てられない。1日にリンク投稿が1本しか無ければ、
# その日のクリック数がそのままその投稿のクリック数になる。
# 追加のインフラも費用もなしに、投稿単位の CTR と EPC が測れる。
#
# 15日で総クリックが5件しか無い状態なので、露出を1本削る損より
# 「どの形式がクリックを取れるか分かる」利益のほうが大きい。
# [experiment] の A/B が終わったら戻してよい。
[[schedule]]
slot = "night"
# 実際に出るのは 22:00 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "15:00"
cron_utc = "0 6 * * *"
post_type = "rotation"
allow_affiliate = false

[[schedule]]
slot = "late"
# 実際に出るのは 23:10 ごろ（GitHub Actions の遅れぶん。2026-10-13 に実測し直した）
time_jst = "16:00"
cron_utc = "0 7 * * *"
post_type = "rotation"
allow_affiliate = false

# ローテーション順（state.json でカーソルを保持）
#
# **2026-09-24 に実績で組み替えた**（切り替え後9日・86投稿の実測）。
#
#   型            表示中央値   人の反応率
#   thread_topic     198        0.15%
#   question         161        0.33%
#   casual            87        0.94%   ← 反応はいちばん取れる
#   no_link           82        0.13%
#   essay             22        0.00%   ← **枠から外した**
#
# essay（書ききる型）は6本出して表示中央値22・反応0。読まれていない。
# テンプレート自体は残してあるので、在庫切れの逃がし先としては使われる。
# 配分: question 22 / casual 20 / thread_topic 18 / no_link 7 / site_link 3（計70）
#
# casual       … ただのつぶやき。結論も落ちもない一行
# question     … 短い問いかけ。返信はいちばん強い反応シグナルなので専用枠にした
# no_link      … 買い物・選び方の話（2段落の助言型）
# thread_topic … 言い切り → 理由の連投
# howto        … 箇条書きのチェックリスト
#
# もとは howto / thread_topic / no_link が枠の大半を占めていて、
# 「役に立つことを整った形で言う」投稿しか出ていなかった。
# 人がふだんThreadsに書くのは結論のない一行や答えのない疑問なので、
# casual と question を主役にして、整った型は少数派にする。
[rotation]
# 2026-10-28: casual（誰でも書ける雑談）19枠のうち13枠を insider に替えた。
# 実測の表示中央値は question 182 / no_link 165 / thread_topic 119 / casual 49 で、
# casual がいちばん低いのにいちばん枠を持っていた。
# insider は「面接官席から見えること」で、このアカウントにしか書けない材料
# （parts.INSIDER_NOTES）。**効果を測れるよう casual とは別の型にしてある。**
# casual を6枠残したのは、反応率（いいねか返信が付いた割合）では
# casual 17% が question 14% より高かったため。生活の断片も要る。
# 2026-09-14: site_link（年収相場チェッカーを置く投稿）を afternoon / earlynight / late に1つずつ入れた。
# 各枠7要素なので、それぞれ週1回前後 ＝ 合計で週3回前後。毎回は出さない。
# 2026-09-03: 8/31 の組み替えを差し戻して組み直した。
#
# ## 8/31 の判断が間違っていた理由
#
# 根拠にした「反応率」は insights.replies から取っており、
# **自分の連投（自己リプライ）を数えていた**。Threads API で返信の
# 投稿者を照合したところ、15日間の返信60件のうち51件が自分の連投だった。
# thread_topic の「反応率0.93%」は6件すべてが自己リプライで、
# 人の反応は 2いいね/859表示 = 0.23% しかない。
# しかも標本が casual n=6 / thread_topic n=3 で、判断できる数ではなかった。
#
# ## 9/3 時点の再集計（初日のブーストを除いた80件）
#
#   型            件数  表示中央値  人の返信
#   no_link         23      174        1
#   question        12      168        6   ← 人が返してくれる唯一の型
#   thread_topic     6      163        0
#   casual          14      157        0
#   howto            4       62        0   ← 表示も反応も最下位。枠から外す
#
# 表示中央値は howto 以外ほぼ横並びで、型で差が付いていない。
# 差が付いているのは「人の返信が来るかどうか」だけなので、
# question を最多にする。Threads は会話が続く投稿を高く評価する。
#
# howto は枠から外した（逃がし先としては _no_link_fallbacks に残る）。
#
# 2026-09-07: essay（リンクなしで書ききる型）を4枠に入れた。
# 上限500字に対して実測は中央値60字。1日10枠のうち9枠がリンクなしなので、
# 書ききる型をリンク投稿にしか入れないと、9割の投稿に効かない。
morning = [
    "insider",
    "question",
    "thread_topic",
    "casual",
    "thread_topic",
    "question",
    "insider",
]
midmorning = [
    "question",
    "insider",
    "no_link",
    "question",
    "thread_topic",
    "thread_topic",
    "question",
]
latemorning = [
    "insider",
    "thread_topic",
    "question",
    "casual",
    "thread_topic",
    "question",
    "insider",
]
afternoon = [
    "question",
    "insider",
    "site_link",
    "thread_topic",
    "question",
    "no_link",
    "thread_topic",
]
predinner = [
    "insider",
    "question",
    "no_link",
    "thread_topic",
    "thread_topic",
    "question",
    "casual",
]
evening = [
    "thread_topic",
    "insider",
    "question",
    "casual",
    "no_link",
    "question",
    "insider",
]
earlynight = [
    "insider",
    "question",
    "thread_topic",
    "site_link",
    "question",
    "casual",
    "no_link",
]
# noon だけがリンク枠。単品と3件まとめを混ぜる。
# longform は「書ききる型」。上限500字に対して実測は中央値60字・最大214字で、
# 半分も使っていなかった。選ぶ観点・3件の数値・並べたときの位置づけまで
# 入れて、読み手が選べるところまで持っていく。
# 2026-09-14: リンク投稿を止めたので、リンクなしの型に差し替えた（7要素のまま）。
# 楽天の商品投稿（product / longform / price_band / postage_free / comparison）は休止。
# 2026-09-28: 本のリンク投稿を再開したので商品の型に戻した。
# price_band と postage_free は入れない（本は定価で、楽天ブックスは送料無料。
# どちらも切り口にならない）。longform は3冊、comparison は2冊を並べる型。
# 2026-10-16: 楽天の本のリンク投稿を外し、反応の良い型と site_link に入れ替えた。
# 型ごとの実測（9/29以降の表示中央値）: comparison 137 / thread_topic 112 /
# question 109 / no_link 92 / casual 82 / longform 20 / product 6。
# product と longform は本のリンク投稿そのものなので、ここから外す。
# site_link を1つ入れて、収益の導線（自サイト → A8）をこの枠にも置く。
noon = [
    "question",
    "thread_topic",
    "site_link",
    "question",
    "thread_topic",
    "insider",
    "no_link",
]
# night / late は 2026-09-03 にリンク許可を外したので、リンクなしの型で回す。
night = [
    "question",
    "thread_topic",
    "insider",
    "question",
    "thread_topic",
    "casual",
    "question",
]
late = [
    "no_link",
    "insider",
    "question",
    "thread_topic",
    "site_link",
    "question",
    "thread_topic",
]

# ------------------------------------------------------------
# ランプアップ（新規アカウントの初期はリンク投稿を抑える）
# ------------------------------------------------------------
[ramp_up]
enabled = true
# 1日の総投稿数の上限。スケジュールは8本なので、少しだけ余裕を持たせる。
#
# ランプアップはリンク投稿の本数しか見ていなかったため、動作確認の手動実行が
# 積み上がって1日18件投稿し、MetaにAPIアクセスをブロックされた。
# 種別も実行トリガーも問わず、ここで頭打ちにする。
#
# 通常投稿の枠を増やしたので 7 → 10 → 12 に上げた。**上限自体は外さない。**
# ここが無いと、手動実行が積み上がったときに同じ事故が起きる。
max_posts_per_day = 12
# 運用開始からの日数 -> その日に許可するアフィリエイトリンク投稿の最大本数
# キーは「この日数まで」
stages = [
    { until_day = 7, max_link_posts = 1 },
    { until_day = 14, max_link_posts = 2 },
]
# 上記を過ぎた後の通常運転。
# 2026-09-03: [[schedule]] のリンク枠自体を1つに絞ったので、ここも1に揃える。
# 二重の歯止めにしておく（片方だけ戻しても事故らない）。
default_max_link_posts = 1

# ------------------------------------------------------------
# A/B
#
# 1回に1つだけ変える。投稿数が少ないので、同時に複数動かすと
# どれが効いたか永久に分からなくなる。
# ------------------------------------------------------------
[experiment]
# リンクをどこに置くか。
#
#   "first" … タイムラインに出る1本に PR・商品名・価格・レビュー・リンクを置く
#   "last"  … 前振りを連投し、最後の1本にまとめる（2026-09-03 までの動作）
#   "ab"    … 運用日の偶奇で交互に出す
#
# 15日間の実測は、リンク投稿の表示 6,211 に対してクリック5件（CTR 0.081%）。
# "last" はタイムラインに商品もリンクも出さないので、クリックまで3手かかる。
# 「リンク付き投稿は表示が落ちる」という前提で選んだ形だったが、
# 初日を除く80件では リンク付き 270 / リンクなし 161 で、
# その前提自体が支持されなかった。どちらが正しいかを実測で決める。
#
# 判定はクリック数。14日で "first" が1件も取れなければ元に戻す。
link_position = "ab"

# ------------------------------------------------------------
# コンプライアンス
# ------------------------------------------------------------
[compliance]
pr_marker = "#PR"
# PR表記の置き場所。"end" = 投稿の最後の行 / "start" = 冒頭
#
# 2026-09-14 に冒頭 → 末尾へ変えた。行頭の #PR は1行目で広告と宣言してしまい、
# おすすめ欄で読まれる前に流される。
#
# 景表法（ステマ規制）が求めるのは位置ではなく「一般消費者が広告と判別できること」。
# 末尾でも判別できるように、次を checker が強制する:
#   * リンクカードが付く投稿（＝商品を紹介している投稿）の中にあること
#   * その投稿の**最後の行**にあること（後ろに別の行を続けて埋もれさせない）
#   * ハッシュタグの羅列に混ぜないこと（#PR だけの独立行）
pr_marker_position = "end"
# 冒頭から（start）／末尾まで（end）この文字数以内に無ければ不合格
pr_marker_max_offset = 20
allowed_url_hosts = ["hb.afl.rakuten.co.jp", "a.r10.to", "affiliate.rakuten.co.jp", "business-3hy.pages.dev"]
# 自分のサイト「年収相場チェッカー」（2026-09-14 追加）。本文に置いてよいURL。**完全一致だけ**。
# 厚労省の賃金構造基本統計調査を出典つきで使うツール。
# 投稿型 site_link だけが載せる（ローテーションで週3回前後）。src/content/parts.py の SITE_URL と一致させる。
own_site_urls = ["https://business-3hy.pages.dev/"]
# **2026-09-28: false → true。サイトに A8.net の広告（UZUZ・doda）が入った。**
# 実際に https://business-3hy.pages.dev/ を取得して px.a8.net のタグを確認済み。
# うちの site_link 投稿はその広告面への導線になるので、投稿にも #PR が要る
# （景表法のステマ規制。サイト側でも「広告」表記を必ず同時に出している）。
own_site_needs_pr = true
# 1投稿あたりのURL上限
max_urls = 1
# 生成をやり直す最大回数
max_regenerations = 4
# 候補商品をスキップして次を試す最大回数
max_item_skips = 12

# ------------------------------------------------------------
# 他人の投稿への返信
#
# 露出を増やす手段。ただし **自動では投稿しない**。
# スクレイプで取れる短縮ID（DTVoI4xlSTZ）は、APIが reply_to_id に
# 要求する数値ID（17908396266285102）とは別のID空間なので、
# そもそもAPIから返信できない。パーマリンクを開いて人が返す。
# ------------------------------------------------------------
[engagement]
# 1日の返信数の上限。Metaのスパム規定は「非常に高い頻度」を見るので、
# 数を追わない。返す価値のある投稿だけに返す。
# **手動返信と共有する。** Meta が見るのは経路ではなくアカウント単位の合計。
# 自動返信を search 3 + timeline 3 + accounts 2 にしたので 3 → 8。
# これは手動 `/reply` の上限も緩めることを意味する（意図どおり）。
max_per_day = 8
# **自分の投稿に付いたコメントへの返信は、ここと別に数える**（2026-10-16）。
#
# 他人の投稿へ出しに行く自動返信とは性質が違う。自分の投稿へのコメントに
# 答えるのは通常の利用の範囲で、むしろ答えないほうが不自然になる。
# 実際、**他人から付いた返信38件のうち答えたのは1件**で、
# 9/26 の投稿に付いた14件も放置されていた。
#
# 同じ上限（max_per_day = 8）を取り合わせると、コメントが来た日に
# 外向きの返信が出せなくなる。別枠にして、こちらにも上限を置く。
max_own_replies_per_day = 5
# **古いコメントには返さない。** 2026-10-28 に動かしたら、9月のコスメ時代の
# 投稿に付いた1か月前のコメントへ返信を書こうとした。1か月遅れの返信は
# 会話として不自然だし、ジャンルも違う投稿に紐づいている。
max_comment_age_days = 14
# 同じ相手に張り付かない
same_account_cooldown_days = 7
# 候補のうち美容・コスメが占める割合。
# 軸は崩さず、外の話題も入れて露出先を狭めすぎない。
beauty_ratio = 0.8
# 1回の収集で出す候補の数
candidate_limit = 12

# ------------------------------------------------------------
# 自動返信（autoreply）— ブラウザ経路 / ローカル実行専用
#
# Threads Web を Playwright で操作し、伸び始めている投稿に自動で返信する。
#
# ## なぜブラウザなのか
#
# 公式APIのキーワード検索はいいね数・返信数を返さないので「伸びている投稿」を
# 判定できず、返信に要る数値IDもスクレイプでは取れない。ブラウザなら
# パーマリンクだけで返信できるので、その制約が消える。
#
# ## GitHub Actions では動かさない
#
# ログイン済みプロファイルが要り、それは絶対にコミットできない。
# データセンターIPからのログイン済みブラウザ操作は制限も受けやすい。
#
# ## 投稿するには鍵が2つ要る
#
#   enabled = true  かつ  --live
#
# どちらか片方だけでは投稿しない。既定は DRY_RUN。
# ------------------------------------------------------------
[autoreply]
# 2026-09-06 に有効化。--live と合わせて2つの鍵が揃って初めて投稿する。
enabled = true
# 1回の実行で出す返信の数。**連投しない。**
# 数分以内に複数返信するのは、最も分かりやすい自動化のシグナル。
max_per_run = 1
# LLM に渡す前の候補の上限
max_candidates_per_run = 60
# 暴走時の頭打ち
max_llm_calls_per_run = 40
# ページ遷移の最短間隔（秒）。**下の返信間隔とは別物。統合しないこと。**
min_interval_seconds = 8.0
# 返信と返信の間隔（分）。実効 45〜90分。
# 自動化は「頻度」より「規則性」で見られるので、間隔をばらつかせる。
# 前回の返信時刻をシードにするため、実行をまたいでも同じ目標時刻になる。
min_reply_interval_minutes = 45
reply_interval_jitter_minutes = 45
# 読んでいる時間のふり（ミリ秒）。この範囲でばらつかせる
dwell_ms_min = 1500
dwell_ms_max = 5000

# 収集元ごとの1日の返信枠。
# 合計は [engagement] max_per_day に収まること（テストが見張る）。
# 2026-09-07 実測でこう配分した。流れてきた479件のうち
#   SNS運用の語あり 32% / 美容の語あり 27%
# タイムラインの中身はフォローで決まるので、目的（コスメの露出）に
# 対しては検索のほうが素直に当たる。合計は max_per_day に収める。
[autoreply.daily_quota]
# 2026-09-24: search 3 → 5、accounts 2 → 0。
# accounts は巡回先が副業・SNS運用のアカウント1件だけで、転職の会話ではなかった。
# 枠を検索へ回す（合計は [engagement] max_per_day = 8 のまま変えない）。
# 転職の話をしている相手が決まったら、[[autoreply.targets]] に足して枠を戻す。
search = 5           # フォローに依存せず、発信ジャンル（転職・年収・キャリア）の会話へ直接入れる
timeline = 3
accounts = 0
default = 1          # 収集元を足したときの暫定枠

# 返す価値のある投稿の条件。ここはルールベースで、LLM を呼ぶ前に効かせる。
[autoreply.filter]
# 古い投稿には返さない。返信が読まれるのは投稿から間もないうち。
#
# **2026-09-07: 12 → 24 に緩めた。**
# ホームTLは時系列ではなくおすすめ順で、実測の中央値は20.6時間。
# 12時間だと1日の実行21回で候補がほぼ出ず、返信が0件だった
# （落ちた理由の最多が「古すぎる」117件）。
# 読まれやすさは buzz の freshness と reaction が順位で見るので、
# ここは «明らかに古い» を落とすだけにする。
max_age_hours = 24
# 反応がまったく無い投稿に返しても見られない。
# **2026-09-07: 20 → 10。** 順位付けを反応数優先にしたので、
# 少ない投稿は下に沈む。ここで硬く切る必要がなくなった。
#
# **2026-09-24: 10 → 4。** 検索を「最近」の並びにしたら、取れるのは投稿直後の
# 新しい投稿になり、いいねはまだ1〜5件しか付いていない。10 のままだと
# 実測25件中16件がここで落ち、返信が1件も出せなかった。
# いいねが3桁ある投稿は逆に1か月以上前のもので、古すぎるほうで落ちる。
# どれを選ぶかは buzz の順位付けに任せ、ここは «反応ゼロ» を落とすだけにする。
min_likes = 4
# 伸びすぎた投稿は返信が埋もれる
max_likes = 20000
# 返信数がこの帯にある投稿を上に置く（逆U字）。
# コメント欄が動いている投稿は良いが、返信500件では自分の返信が埋もれる。
# 2026-09-06 に反応数優先へ切り替えたので、いまは重み0で効いていない
# （[autoreply.buzz] reply_fit_weight）。戻すのは設定1行。
reply_band_low = 3
reply_band_high = 60
# **返信がこれ以上ある投稿には返さない。**
# 埋もれるかどうかは「自分より上に何件コメントがあるか」で決まる。
# いいねでは埋もれないので、上限は返信数で見る（max_likes は別の目的）。
# **2026-09-07: 100 → 50。**
# 「一番バズっている投稿」と「自分の返信が読まれる投稿」は別物。
# 返信が100件付いた投稿に足しても、誰もそこまでスクロールしない。
max_replies = 50
# 同じ相手に続けて返さない。収集元ごとに上書きできる。
same_account_cooldown_days = 7
# 触れる具体が無い投稿は外す
min_text_length = 30
# **日本語の投稿にだけ返す。**
# 2026-09-07: ベトナム語の写真投稿に日本語で返信してしまった。
# 相手にも読めないし、このアカウントの話を届けたい人にも届かない。
require_japanese = true
# 見た投稿を忘れるまでの日数
seen_ttl_days = 45

# --- 発信ジャンルの外の話に返さない（2026-10-13） ---
#
# ホームTLのフォロー先がコスメ時代のまま残っているので、香水・下地・
# クレンジングの投稿が流れてくる。実測（9/27〜9/30）では**タイムラインから
# 出した返信4件のうち3件がコスメの話だった**（AUX PARADIS の香水、
# kiss の下地とマキアージュ、メイク落としの洗浄力）。
# 転職の話をしているアカウントが化粧品に返していると、
# 何のアカウントなのか読む側に分からない。
#
# ここは**語で確定的に落とす**ところ。LLM の前に置くので費用も時間もかからない。
# 検索（search）は転職の語で引いているので、下の [autoreply.filter.timeline] で
# 「ジャンルの語が1つも無ければ返さない」を足すのはタイムラインだけ。
off_topic_keywords = [
    # コスメ・美容（前のジャンル）
    "化粧水", "美容液", "乳液", "下地", "ファンデ", "クッション",
    "アイシャドウ", "マスカラ", "アイライナー", "チーク", "リップ",
    "クレンジング", "メイク落とし", "洗顔", "パック", "スキンケア",
    "日焼け止め", "UVカット", "香水", "フレグランス",
    "ヘアオイル", "シャンプー", "トリートメント",
    "ネイル", "まつエク", "眉毛", "毛穴", "ニキビ", "くすみ", "乾燥肌",
    "デパコス", "プチプラ", "コスメ",
]
# 荒れやすい話題（病気・政治など）はここに足さない。
# `candidates.sensitive_hits` と verify が別に見ていて、
# 二重に書くと片方だけ直して食い違う。実測で止めたいのは前のジャンルだけ。
#
# 「UV」「ライブ」のような短い語も入れない。UVERworld・ライブ配信の仕事のような
# 関係のない投稿まで落ちる。語は**前のジャンルだと分かる長さ**にする。

# 監視対象（[[autoreply.targets]]）のときだけ上書きする条件。
#
# タイムラインは «偶然流れてきた知らない投稿» なので厳しく見るが、
# 監視対象は人が選んだ相手なので、同じ厳しさで見る理由がない。
#
# 2026-09-05 に13アカウントを実測してこう決めた:
#   ・新しい投稿は反応がまだ付いていない（いいね2〜3）→ min_likes を外す
#   ・反応の多い投稿は12時間を超えている（♥992 が18時間前）→ 24時間まで見る
# 検索は「最近」の並びで引くので、拾えるのは投稿直後のものになる（実測で0〜4時間前）。
# その時点のいいねは1〜5件しかなく、base の min_likes = 4 では
# 2026-09-24 の実測で22件中20件がここで落ちた。
# **どれに返すかは buzz の順位付けに任せ、ここは «反応ゼロ» を落とすだけにする。**
# 伸びる前の投稿に早く入るほうが、コメント欄で埋もれない。
[autoreply.filter.search]
min_likes = 2

# --- タイムラインだけの上書き ---
#
# おすすめ順のTLは «偶然流れてきた知らない投稿» なので、
# **転職・仕事の語が1つも無い投稿には返さない**。
# 検索は語で引いた結果なのでこの条件は掛けない（掛けると二重になる）。
[autoreply.filter.timeline]
require_topic_any = [
    "転職", "就職", "再就職", "求人", "面接", "履歴書", "職務経歴書",
    "キャリア", "年収", "給料", "給与", "手取り", "ボーナス", "賞与",
    "昇進", "昇給", "査定", "人事", "採用", "内定", "退職", "辞め",
    "エージェント", "スカウト", "リクルート", "doda", "ハロワ", "ハローワーク",
    "仕事", "職場", "会社", "上司", "部下", "同僚", "社員", "社畜",
    "残業", "有給", "在宅", "リモート", "出社", "異動", "部署",
    "入社", "勤務", "働き", "就業", "副業", "独立", "フリーランス",
    "資格", "簿記", "宅建", "TOEIC", "勉強", "スキル", "リスキリング",
    "新人", "若手", "ベテラン", "管理職", "面談", "評価",
]

[autoreply.filter.accounts]
max_age_hours = 24
min_likes = 0
max_replies = 80
# **監視対象には1日に何度でも返す**（その日バズっている投稿に最大3件）。
# ただし立て続けには返さない。狙い撃ちに見えるのは、レート制限とは別の
# 失敗の仕方（相手にブロック・報告される）。
same_account_cooldown_days = 0
same_account_cooldown_hours = 3


# 伸びの速度。**いいねの絶対数ではなく、単位時間あたりの伸びを見る。**
[autoreply.buzz]
# 既存 candidates.score()（美容関連度・勢い・新しさ）の寄与
base_weight = 1.0
# **反応の絶対数**（いいね + 返信×8）。2026-09-06 に主軸をここへ移した。
reaction_weight = 3.0
reaction_saturation = 5000
# 前回観測からの実測の伸び。初回観測時は 0 になる
velocity_weight = 1.5
# 返信数の逆U字。**上側は max_replies へ移したので重み0。**
# 関数もテストも残してあるので、戻したければこの値を上げるだけ。
reply_fit_weight = 0.0
# この間隔未満では速度を計算しない（分母が小さすぎて暴れる）
min_observation_hours = 0.5

[autoreply.browser]
# ログインセッションの置き場。**絶対にコミットしない**（.gitignore 済み）
profile_dir = ".playwright/threads-profile"
headless = true
nav_timeout_ms = 60000
# 1文字ごとの待ち（ミリ秒）。貼り付けは機械に見える
type_delay_ms_min = 40
type_delay_ms_max = 110

[autoreply.llm]
# Anthropic の HTTP API は使わない。サブスクリプションの claude CLI を叩く。
# こうすると追加課金が 0円 のまま（CLAUDE.md「コストは0円に保つ」）。
binary = "claude"
model = "sonnet"
timeout_seconds = 120
min_interval_seconds = 2.0
# 機械の検査（URL・NG表現・定型句・類似度）で落ちたときに書き直す回数
max_generation_attempts = 3
# **審査（ReplyJudge）で落ちたときに書き直す回数。**
# 審査は problems と rewrite を返すので、それを渡して直させる。
# 0 にすると1発勝負になり、せっかく «返信してよい» と判断した相手を毎回逃す。
max_judge_rounds = 4
# 返信対象として認める下限（0-1）。
#
# **ここは «LLM を無駄に使わないための粗いふるい» で、品質の門番ではない。**
# 品質を決めるのは後段の reply_score_threshold と max_ai_smell で、
# その手前に review()（URL・NG表現・定型句）と similarity() もある。
#
# 2026-09-06 実測: 同じ投稿（資生堂ハイライト ♥148）を3回判定させたら
# 0.35 / 0.60 / 0.70 とばらついた。0.7 だと境界に乗るので、
# 返信できたはずの候補を2/3の確率で捨てていた。
# 2026-09-07: 21回の実行で返信0件だったので、判定の役割を
# 「返信する価値があるか」から「返して危なくないか」へ変えた。
# 既定は «返してよい» で、落とすのは危ないときと中身が無いときだけ。
# 会話として成立するかは下流（writer / ReplyJudge）が見る。
target_score_threshold = 0.6
# 投稿を認める下限（0-1）。
# 2026-09-07: 0.8 → 0.75。審査の点は同じ文でも±0.15ほどぶれるので、
# 0.8 だと «通ってよい返信» が運で落ちる。品質の芯は下の specific
# （投稿を読まずに書けるか）が持っているので、そちらは緩めない。
reply_score_threshold = 0.75
# 「AIが書いた感」の上限。これを超えたら落とす
max_ai_smell = 0.35
# 書かれている感情が投稿の中身と釣り合っているかの下限。
# 2026-09-07: 笑える中身がない投稿に「笑った」と返してしまった。
# **無い感情を書くのが、いちばん «AIが書いた» と分かる。**
min_emotion_fit = 0.5

[autoreply.sources]
# 収集元。**追加は additive** — 名前を足すだけで有効になる。
enabled = ["search", "timeline", "accounts"]
# 検索する語。1回に search_per_run 語だけ引き、毎回ずらして全部を薄く回る。
# **検索ページも開きすぎれば絞られる対象。**
# 2026-09-14: 発信ジャンルを「コスメ・美容」→「転職・年収・キャリア」へ変えたので差し替えた
search_keywords = [
    "転職", "転職活動", "年収", "年収交渉",
    "面接", "職務経歴書", "退職", "キャリア",
    "未経験転職", "転職エージェント", "残業", "仕事辞めたい",
]
# 2026-09-24: 2 → 3。「最近」の並びにしたぶん、1語あたりの当たりが薄くなったので語数で補う
search_per_run = 3
search_scrolls = 2
timeline_scrolls = 6
account_scrolls = 2
# **1回に開くプロフィールは1件だけ。**
#
# 2026-09-05 に13件を続けて開いたら、プロフィールだけが
# 「エラーが発生しました。後ほどもう一度実行してください。」を返すようになった
# （ホームTLは正常のまま）。Threads は短時間に多くのプロフィールを開く動きを見ている。
#
# 毎回1件ずつずらして回るので、13件を一巡するのに13回かかる。
# 1日5回なら2〜3日で一周する。**主力はタイムライン**で、
# プロフィール巡回はその上に薄く乗せる位置づけ。
accounts_per_run = 1
# **プロフィールを開く回数そのものがリスク。**
# 監視対象の投稿はホームTLにも流れてくるので、runner が
# 「誰の投稿か」で source を付け替える。プロフィールを開かずに拾えた分は
# ここを消費しない。

# 始めのうちは返信も絞る。
#
# **日数は「自動返信が初めて実際に返信した日」から数える。**
# [ramp_up]（投稿パイプライン）の運用開始日とは別物。2026-09-06 まで
# operation_started_on を見ており、日数が18日先行していたため
# **ランプは一度も効いていなかった**。
#
# 人が手を加えない運用なので、これが唯一の自動の歯止め。
[autoreply.ramp_up]
enabled = true
stages = [
    { until_day = 7, search = 1, timeline = 1, accounts = 1 },   # 3/日
    { until_day = 14, search = 2, timeline = 2, accounts = 1 },  # 5/日
]

# ------------------------------------------------------------
# 巡回する人気アカウント。@ は付けない。
#
# **research/accounts.md を流用しないこと。**
# あちらは「文体の参考先」で、コスメ時代（〜2026-09-14）の参考アカウントが入っている。
# 返信先は別途、人が選ぶ。転職・年収・キャリアの話をしている相手を足すなら:
#
#   [[autoreply.targets]]
#   username = "example_career"
#   note = "転職の体験を毎日投稿している。返信欄が動いている"
#   weight = 1.0
# ------------------------------------------------------------

# --- 2026-09-05 追加。フォロー中のアカウントから ---
#
# **注意: 美容アカウントではない。** SNS運用・副業・アフィリエイト・
# ライティング系が中心。
#
# 2026-09-14 に発信ジャンルを転職・年収・キャリアへ変えたとき、残すことにした。
# 副業・働き方は新しいジャンルの話題で、コスメの投稿に返信する設定ではないため。
# 「副業」は candidates.SENSITIVE_WORDS から外したが、「稼げ」「情報商材」等の
# 勧誘は引き続きルール段階で落ちる。
# 実際にどれだけ通るかは --collect-only で見ながら調整すること。

# 2026-09-24: 下の巡回先を止めた。副業・SNS運用のアカウントで、転職の会話ではない。
# 転職・年収の話を毎日していて返信欄が動いている相手が見つかったら、ここに足して
# [autoreply.daily_quota] の accounts を戻すこと。
#
# [[autoreply.targets]]
# 2026-09-05 実測: 最新投稿1時間前で、取得4件すべてが12時間以内だった。
# このとき13件を登録して測ったが、24時間以内に投稿していたのは3件だけで、
# 残り10件は44時間〜165日前。反応はいいね2〜3と少ないが、
# **投稿頻度がある = 新しい投稿を拾える**のがこの相手を残した理由。
# username = "poco_insta_life"
# note = "投稿頻度が高く新着を拾える。2026-09-05 の実測で唯一まともに動いていた相手"
