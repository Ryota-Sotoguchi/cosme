name: research

# 参考アカウントの投稿を毎日ためる。
#
# 分析はしない。型の抽出には「うちの制約で使えるか」という判断が要るので、
# それは `/research` で人がやる。ここの仕事は取りこぼさないことだけ。
#
# ためておけば、何日か空けてから読んでも分析できる。
# 逆に、ためていないと「あの日バズってた投稿」は二度と拾えない。
on:
  schedule:
    - cron: '30 14 * * *'   # 23:30 JST（その日の投稿が出そろった後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # 本体の requirements には入れない。
      # 投稿パイプラインはブラウザを必要としないので、依存を混ぜたくない。
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Collect
        run: python scripts/collect_threads.py

      # 返信する価値のある他人の投稿を集める。
      # 公式APIのキーワード検索はいいね数・返信数を返さないので、
      # 「伸びている投稿」を判定するにはページを描画して読むしかない。
      # **返信はしない。** 候補を出すだけで、返すのは人。
      - name: Collect reply candidates
        run: python scripts/collect_candidates.py --limit 12

      # 投稿済み商品のレビューから「使った人がどう感じたか」を集める。
      #
      # 投稿の主役はこれ。こちらは商品を使っていないので「良かった」とは
      # 書けないが、何百人が同じ使用感を書いているのは事実で、
      # 値段やレビュー件数より読み手の判断を助ける。
      #
      # 手で走らせる前提のままだったため、2026-09-03 時点で
      # data/voices.json は2商品ぶんしか無く、ほとんどの投稿が
      # 声なしで出ていた。定期実行に載せて素材を絶やさない。
      #
      # **レビュー本文は保存しない。** 使用感の語が何件のレビューに
      # 出たかという数だけを残す（本文は書いた人の著作物）。
      - name: Collect product reviews
        run: python scripts/collect_reviews.py --limit 12

      # 収集した生データには第三者のユーザー名と本文が含まれる。
      # 公開リポジトリに残さず、成果物として90日だけ保持する。
      # 分析（research/PATTERNS.md）は人が書いたものなのでコミットする。
      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-${{ github.run_number }}
          path: |
            research/log/raw/
            research/replies/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain research/ data/voices.json)" ]; then
            echo "変化なし"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ data/voices.json
          git commit -m "chore(research): 参考アカウントの投稿と使用感を収集 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
