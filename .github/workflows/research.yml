name: research

# 参考アカウントの投稿を毎日ためる。
#
# 分析はしない。型の抽出には「うちの制約で使えるか」という判断が要るので、
# それは `/research` で人がやる。ここの仕事は取りこぼさないことだけ。
#
# ためておけば、何日か空けてから読んでも分析できる。
# 逆に、ためていないと「あの日バズってた投稿」は二度と拾えない。
on:
  schedule:
    - cron: '30 14 * * *'   # 23:30 JST（その日の投稿が出そろった後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # **本体の依存（requirements.txt）も入れる。**
      #
      # collect_reviews.py は src.content.voices を import し、パッケージの
      # __init__ 経由で src.http → requests まで読み込む。playwright だけ入れて
      # いたので 2026-09-06 から毎日 ModuleNotFoundError で落ち、
      # data/voices.json が1週間更新されていなかった（Commit も走らなかった）。
      #
      # playwright は requirements-browser.txt から入れる（本体とは分けたまま）。
      # test_workflows.py が「src/ を読むワークフローは requirements.txt を入れる」
      # ことを見張る。
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-browser.txt

      # apt のミラーが一時的に落ちると exit 100 で失敗する（2026-09-09 に発生）。
      # 投稿とは無関係な一時障害なので、少し待って2回まで試し直す。
      - name: Install Chromium
        run: |
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "::warning::Chromium の導入に失敗（${i}回目）。30秒後に再試行します"
            sleep 30
          done
          exit 1

      - name: Collect
        run: python scripts/collect_threads.py

      # 返信する価値のある他人の投稿を集める。
      # 公式APIのキーワード検索はいいね数・返信数を返さないので、
      # 「伸びている投稿」を判定するにはページを描画して読むしかない。
      # **返信はしない。** 候補を出すだけで、返すのは人。
      - name: Collect reply candidates
        run: python scripts/collect_candidates.py --limit 12

      # 投稿済み商品のレビューから「使った人がどう感じたか」を集める。
      #
      # 投稿の主役はこれ。こちらは商品を使っていないので「良かった」とは
      # 書けないが、何百人が同じ使用感を書いているのは事実で、
      # 値段やレビュー件数より読み手の判断を助ける。
      #
      # 手で走らせる前提のままだったため、2026-09-03 時点で
      # data/voices.json は2商品ぶんしか無く、ほとんどの投稿が
      # 声なしで出ていた。定期実行に載せて素材を絶やさない。
      #
      # **レビュー本文は保存しない。** 使用感の語が何件のレビューに
      # 出たかという数だけを残す（本文は書いた人の著作物）。
      - name: Collect product reviews
        run: python scripts/collect_reviews.py --limit 12

      # 収集した生データには第三者のユーザー名と本文が含まれる。
      # 公開リポジトリに残さず、成果物として90日だけ保持する。
      # 分析（research/PATTERNS.md）は人が書いたものなのでコミットする。
      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-${{ github.run_number }}
          path: |
            research/log/raw/
            research/replies/
          retention-days: 90
          if-no-files-found: ignore

      # **収集の1工程が落ちても、ほかの工程の結果はコミットする。**
      #
      # ここの仕事は取りこぼさないこと。以前は collect_reviews だけが落ちても
      # Commit まで飛ばされ、成功していた他の収集結果も捨てていた。
      # ジョブ自体は失敗のまま終わるので、通知は届く（黙って握りつぶさない）。
      - name: Commit
        if: always()
        run: |
          if [ -z "$(git status --porcelain research/ data/voices.json)" ]; then
            echo "変化なし"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ data/voices.json
          git commit -m "chore(research): 参考アカウントの投稿と使用感を収集 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
