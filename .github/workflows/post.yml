name: post

# 日本はサマータイムが無く UTC+9 固定なので、cron は UTC で書いている。
# timezone フィールドに依存せず、意味が一意に決まる方を選んだ。
#   07:30 JST = 22:30 UTC (前日)  … morning     リンクなし
#   09:30 JST = 00:30 UTC         … midmorning  リンクなし
#   11:00 JST = 02:00 UTC         … latemorning リンクなし
#   12:15 JST = 03:15 UTC         … noon        商品紹介 #PR  ← 唯一のリンク枠
#   14:30 JST = 05:30 UTC         … afternoon   リンクなし
#   16:30 JST = 07:30 UTC         … predinner   リンクなし
#   18:00 JST = 09:00 UTC         … evening     リンクなし
#   19:00 JST = 10:00 UTC         … earlynight  リンクなし
#   20:30 JST = 11:30 UTC         … night       リンクなし
#   22:30 JST = 13:30 UTC         … late        リンクなし
#
# 2026-09-03: リンクを許可するのは noon の1枠だけにした。
# 楽天アフィリエイトのレポートは日次のクリック数しか出せず、投稿単位に
# 割り当てられない。1日1本なら、その日のクリック数がそのまま
# その投稿のクリック数になる（費用ゼロで投稿別CTRが測れる）。
# 枠を増やすときはリンクなし側に足すこと。
# （test_affiliate_slots_are_limited が3枠以下を強制している）
#
# 定期実行が設定時刻から90分以上ずれたら、その枠は見送る
# （config の [schedule_settings] max_drift_minutes）。
# 8/27以降、4〜11時間半の遅延で深夜に朝の投稿が出ていたため。
#
# cron 文字列から config/config.toml の [[schedule]] を引いてスロットを決めるので、
# 時刻を変えるときは「この cron」と「config.toml の cron_utc」の両方を揃えること。
on:
  schedule:
    # **時刻は «発火» であって «投稿が出る時刻» ではない。**
    # GitHub Actions の定期実行は混んでいる時間帯ほど遅れる。実測（273投稿）では
    # 発火が 22:30 UTC のときだけ中央値 +116分 で、00:00〜13:00 UTC では +224〜301分だった。
    # そのため 2026-09-24 に、**出したい時刻から遅れぶんを引いた時刻**へ組み直した。
    # 元は 07:30〜22:30 JST に発火していたが、実際に出ていたのは 09:26〜02:14 JST で、
    # 深夜2時台に1本落ちていた（表示中央値0〜74）。
    # config.toml の [[schedule]] と**両方**直すこと（test_schedule.py が突き合わせる）。
    - cron: '30 20 * * *'   # 05:30 JST 発火 → 07:30 ごろ（通勤）
    - cron: '30 21 * * *'   # 06:30 JST 発火 → 08:30 ごろ
    - cron: '0 23 * * *'    # 08:00 JST 発火 → 10:00 ごろ
    - cron: '30 0 * * *'    # 09:30 JST 発火 → 14:00 ごろ
    - cron: '0 2 * * *'     # 11:00 JST 発火 → 16:00 ごろ
    - cron: '30 3 * * *'    # 12:30 JST 発火 → 17:20 ごろ
    - cron: '0 6 * * *'     # 15:00 JST 発火 → 19:30 ごろ
    - cron: '0 7 * * *'     # 16:00 JST 発火 → 20:30 ごろ
    - cron: '0 8 * * *'     # 17:00 JST 発火 → 21:30 ごろ
    - cron: '30 9 * * *'    # 18:30 JST 発火 → 22:45 ごろ
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット'
        required: true
        type: choice
        options: [morning, midmorning, latemorning, noon, afternoon,
                  predinner, evening, earlynight, night, late]
        default: morning
      dry_run:
        description: 'DRY_RUN（Threadsへは投稿しない）'
        required: true
        type: boolean
        default: true

# 同時実行を防ぐ。data/ をコミットバックするので競合させたくない。
concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write   # data/ のコミットバックに必要

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post
        id: post
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ORIGIN: ${{ secrets.RAKUTEN_ORIGIN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          # 手動実行がランプアップのリンク枠を食わないようにするための識別
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m src.main post --cron "${{ github.event.schedule }}"
          else
            python -m src.main post --slot "${{ inputs.slot }}"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 = 一時障害。次回の定期実行で自然に回復しうるのでジョブは落とさない。
          if [ $code -eq 2 ]; then
            echo "::warning::一時障害のためスキップしました (exit 2)"
            exit 0
          fi
          exit $code

      - name: Commit history
        # 投稿が失敗しても履歴は残す。
        # このコミットが「リポジトリ活動」になり、public リポジトリの
        # スケジュールが60日無活動で自動無効化されるのも同時に防いでいる。
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "履歴に変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): 投稿履歴を更新 [skip ci]"
          # 別ジョブと衝突した場合に備えてリベースしてから push
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::履歴のpushに失敗しました"
